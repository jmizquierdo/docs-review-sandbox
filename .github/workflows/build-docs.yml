name: Build documents

on:
  pull_request:
    paths:
      - "docs/**.md"
      - "REVIEWING.md"
      - "guide/images/**"
      - "docx-format.yaml"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/build-docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**.md"
      - "REVIEWING.md"
      - "guide/images/**"
      - "docx-format.yaml"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the build that is still running for the old commit.
concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cached between runs: the image is only rebuilt when tools/Dockerfile or requirements.txt change.
      - name: Build the rendering image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/Dockerfile
          tags: docs-builder:ci
          load: true
          cache-from: type=gha,scope=docs-builder
          cache-to: type=gha,scope=docs-builder,mode=max

      - name: Render Markdown to DOCX (docx-format.yaml) and PDF
        run: docker run --rm -v "$PWD:/work" -u "$(id -u):$(id -g)" docs-builder:ci bash tools/render-all.sh

      - name: Upload rendered documents
        uses: actions/upload-artifact@v7
        with:
          name: rendered-documents
          path: output/
          if-no-files-found: error
