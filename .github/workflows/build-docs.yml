name: Build documents

on:
  pull_request:
    paths:
      - "docs/**.md"
      - "REVIEWING.md"
      - "guide/images/**"
      - "docx-format.yaml"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/build-docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**.md"
      - "REVIEWING.md"
      - "guide/images/**"
      - "docx-format.yaml"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice and fonts
        # Carlito and Caladea have the same metrics as Calibri and Cambria, so Word layouts don't shift.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation fonts-dejavu

      - name: Render Markdown to DOCX (docx-format.yaml) and PDF
        run: |
          shopt -s nullglob
          mkdir -p output
          files=(docs/*.md)
          [ -f REVIEWING.md ] && files+=(REVIEWING.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No documents found" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            python tools/md-to-docx.py "$f" "output/$(basename "$f" .md).docx" --config docx-format.yaml
          done
          soffice --headless --convert-to pdf --outdir output output/*.docx
          ls -l output

      - name: Upload rendered documents
        uses: actions/upload-artifact@v7
        with:
          name: rendered-documents
          path: output/
          if-no-files-found: error
