name: Build documents

on:
  pull_request:
    paths:
      - "docs/**.md"
      - "REVIEWING.md"
      - "guide/images/**"
      - "docx-format.yaml"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/build-docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**.md"
      - "REVIEWING.md"
      - "guide/images/**"
      - "docx-format.yaml"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the build that is still running for the old commit.
concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render Markdown to DOCX (docx-format.yaml)
        run: bash tools/render-all.sh

      - name: Upload rendered documents
        uses: actions/upload-artifact@v7
        with:
          name: rendered-documents
          path: output/
          if-no-files-found: error
